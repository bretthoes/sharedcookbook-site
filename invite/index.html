    <p>You've been invited to join a cookbook! Open this link in the Love to Cook app.</p>
    <script>
      ;(function () {
        var params = new URLSearchParams(window.location.search)

        window.location.replace("cookbookmobile:///i/" + token)
      })()
    </script>
