<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open in Love to Cook</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        line-height: 1.55;
      }
      body {
        max-width: 42rem;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 3rem;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <h1>Love to Cook</h1>
    <p id="message">Opening the app…</p>
    <p><a id="open-link" href="#">Tap here if nothing happens</a></p>
    <script>
      ;(function () {
        var match = window.location.pathname.match(/^\/i\/([^/?#]+)/)
        if (!match) return

        var token = decodeURIComponent(match[1])
        var appUrl = "cookbookmobile:///i/" + encodeURIComponent(token)
        var link = document.getElementById("open-link")
        link.href = appUrl
        window.location.replace(appUrl)

        setTimeout(function () {
          document.getElementById("message").textContent =
            "If the app did not open, tap the link above."
        }, 1500)
      })()
    </script>
  </body>
</html>
